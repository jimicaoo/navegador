<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Início</title>
<script>
(function () {
  var t = "dark";
  try { t = JSON.parse(window.localStorage.getItem("ps5home_theme") || '"dark"'); } catch (e) {}
  document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Temas ===== */
  :root, html[data-theme="dark"] {
    --bg0: #070b18;
    --fallback: radial-gradient(ellipse at 50% -10%, #1d2c70 0%, #0b1230 48%, #070b18 88%);
    --shade: rgba(4,7,18,0.52);
    --ink: #f5f7ff;
    --ink-soft: #b7c0d8;
    --surface: rgba(17,24,48,0.92);
    --surface-2: rgba(255,255,255,0.09);
    --line: rgba(255,255,255,0.14);
    --accent: #5468ff;
    --accent-grad: linear-gradient(135deg, #6b6dff, #3f5df0);
    --accent-soft: rgba(84,104,255,0.28);
    --danger-ink: #ff9ca7;
    --danger-bg: rgba(255,93,108,0.17);
    --focus: #ffd166;
    --focus-glow: rgba(255,209,102,0.45);
    --star: #ffd166;
    --drag-bg: #1b2756;
    --shadow: 0 10px 30px rgba(0,0,0,0.38);
    --text-shadow: 0 2px 14px rgba(0,0,0,0.55);
    --btn-bg: rgba(255,255,255,0.07);
    --btn-line: rgba(255,255,255,0.18);
    --edit-bg: rgba(104,122,255,0.20);
    --edit-line: rgba(130,146,255,0.50);
    --edit-ink: #e4e8ff;
    --del-bg: rgba(255,93,108,0.14);
    --del-line: rgba(255,120,134,0.50);
    --del-ink: #ffb4bd;
    --go-shadow: 0 8px 22px rgba(63,93,240,0.45);
  }
  html[data-theme="light"] {
    --bg0: #eef1fb;
    --fallback: radial-gradient(ellipse at 50% -10%, #d9e0ff 0%, #eef1fb 50%, #f8f9fe 90%);
    --shade: rgba(255,255,255,0.55);
    --ink: #121833;
    --ink-soft: #46506e;
    --surface: rgba(255,255,255,0.94);
    --surface-2: rgba(30,40,110,0.07);
    --line: rgba(20,30,90,0.16);
    --accent: #3f4ee8;
    --accent-grad: linear-gradient(135deg, #5865ff, #3340d6);
    --accent-soft: rgba(63,78,232,0.15);
    --danger-ink: #bd1f36;
    --danger-bg: rgba(220,38,60,0.10);
    --focus: #3340d6;
    --focus-glow: rgba(63,78,232,0.35);
    --star: #d98a00;
    --drag-bg: #ffffff;
    --shadow: 0 10px 30px rgba(30,40,110,0.14);
    --text-shadow: none;
    --btn-bg: rgba(20,30,90,0.05);
    --btn-line: rgba(20,30,90,0.20);
    --edit-bg: rgba(63,78,232,0.10);
    --edit-line: rgba(63,78,232,0.42);
    --edit-ink: #2a35b5;
    --del-bg: rgba(220,38,60,0.08);
    --del-line: rgba(200,35,58,0.42);
    --del-ink: #b01c32;
    --go-shadow: 0 8px 20px rgba(63,78,232,0.35);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg0);
    color: var(--ink);
    font-family: "Plus Jakarta Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  }

  /* ===== Fundo ===== */
  #bgFallback {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0;
    background: var(--fallback);
  }
  #bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    background: var(--bg0);
  }
  #shade {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1;
    background: var(--shade);
  }

  /* ===== Layout ===== */
  #page {
    position: relative;
    z-index: 2;
    min-height: 100%;
    padding: 108px 24px 64px;
    display: flex;
    justify-content: center;
  }
  #card { width: 100%; max-width: 1000px; }

  #topBar {
    position: fixed;
    top: 20px;
    right: 24px;
    z-index: 4;
    display: flex;
  }

  #titleRow { display: flex; align-items: center; margin-bottom: 30px; }
  #titleImg {
    flex: none;
    width: 104px;
    height: 104px;
    margin-right: 24px;
    border-radius: 24px;
    overflow: hidden;
    border: 2px solid var(--line);
    background: var(--surface);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #titleImg.empty { border-style: dashed; }
  #titleImg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 {
    margin: 0;
    font-size: 48px;
    font-weight: 800;
    letter-spacing: -1px;
    text-shadow: var(--text-shadow);
  }

  /* ===== Barra de busca ===== */
  .bar {
    display: flex;
    align-items: stretch;
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 24px;
    padding: 10px;
    box-shadow: var(--shadow);
  }
  .bar:focus-within { border-color: var(--accent); }
  .bar input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 26px;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    border: 2px solid transparent;
    border-radius: 14px;
    outline: none;
    padding: 12px 16px;
  }
  .bar input::placeholder { color: var(--ink-soft); }

  /* ===== Botões ===== */
  .btn {
    display: -webkit-inline-flex;
    display: inline-flex;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
    font: inherit;
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.2px;
    color: var(--ink);
    background: var(--btn-bg);
    border: 2px solid var(--btn-line);
    border-radius: 14px;
    padding: 0 22px;
    margin-left: 10px;
    min-height: 60px;
    cursor: pointer;
    -webkit-transition: -webkit-transform 0.12s ease, background 0.15s ease;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .btn svg { display: block; flex: none; }
  .btn svg + span { margin-left: 9px; }
  .btn:active { -webkit-transform: scale(0.96); transform: scale(0.96); }

  .btn.go {
    background: var(--accent-grad);
    border-color: transparent;
    color: #fff;
    font-size: 22px;
    padding: 0 30px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.32), var(--go-shadow);
  }
  .btn.fav svg { color: var(--star); }
  .btn.on { background: var(--accent-soft); border-color: var(--accent); }
  .btn.icon { min-height: 58px; padding: 0 17px; background: var(--surface); box-shadow: var(--shadow); }

  /* foco / cursor: precisa vencer as cores próprias de cada botão */
  button.btn:focus, button.btn:hover,
  .bar input:focus,
  a.link:focus, a.link:hover,
  .edit-input:focus {
    outline: none;
    border-color: var(--focus);
    box-shadow: 0 0 0 4px var(--focus-glow);
  }

  .btn.icon .ico-moon { display: none; }
  html[data-theme="light"] .btn.icon .ico-sun { display: none; }
  html[data-theme="light"] .btn.icon .ico-moon { display: block; }

  /* ===== Listas ===== */
  .section { margin-top: 32px; }
  .section h2 {
    margin: 0 0 14px 6px;
    font-size: 26px;
    font-weight: 800;
    text-shadow: var(--text-shadow);
  }
  .list { list-style: none; margin: 0; padding: 0; }
  .item {
    position: relative;
    display: flex;
    align-items: stretch;
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 20px;
    padding: 8px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    -webkit-user-select: none;
    user-select: none;
    -webkit-transition: -webkit-transform 0.15s ease;
    transition: transform 0.15s ease;
  }
  .item.dragging {
    z-index: 6;
    -webkit-transition: none;
    transition: none;
    background: var(--drag-bg);
    border-color: var(--focus);
    box-shadow: 0 18px 44px rgba(0,0,0,0.45), 0 0 0 3px var(--focus-glow);
  }
  a.link {
    flex: 1;
    min-width: 0;
    display: block;
    color: var(--ink);
    text-decoration: none;
    font-size: 22px;
    font-weight: 600;
    padding: 14px 16px;
    border: 2px solid transparent;
    border-radius: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .btn.act { font-size: 18px; min-height: 50px; padding: 0 18px; }
  .btn.edit { background: var(--edit-bg); border-color: var(--edit-line); color: var(--edit-ink); }
  .btn.del { background: var(--del-bg); border-color: var(--del-line); color: var(--del-ink); }
  .btn.ok { background: var(--accent-grad); border-color: transparent; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.3); }
  .btn.star { color: var(--star); padding: 0 16px; }
  .btn.star.on { background: var(--accent-soft); border-color: var(--accent); }
  .edit-input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
    background: var(--surface-2);
    border: 2px solid var(--accent);
    border-radius: 12px;
    outline: none;
    padding: 12px 16px;
    -webkit-user-select: text;
    user-select: text;
  }
  .empty { color: var(--ink-soft); font-size: 19px; font-weight: 500; padding: 6px 6px; }
  .hidden { display: none; }

  /* ===== Confirmação ===== */
  .modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 20;
    background: rgba(4,7,18,0.72);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal.show { display: flex; }
  .modal-box {
    width: 100%;
    max-width: 620px;
    background: var(--surface);
    color: var(--ink);
    border: 2px solid var(--line);
    border-radius: 28px;
    padding: 36px 34px 28px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.5);
  }
  .modal-box h2 { margin: 0 0 12px; font-size: 30px; font-weight: 800; }
  .modal-box p { margin: 0 0 26px; font-size: 19px; line-height: 1.55; color: var(--ink-soft); }
  .modal-btns { text-align: right; }
  .modal-btns .btn { min-height: 56px; margin-left: 10px; }
  .btn.danger { background: var(--del-bg); border-color: var(--del-line); color: var(--del-ink); }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    z-index: 30;
    background: #121833;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 14px;
    padding: 14px 24px;
    font-size: 19px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="bgFallback"></div>
<video id="bg" muted playsinline autoplay preload="auto"></video>
<div id="shade"></div>

<div id="page">
  <div id="card">
    <div id="topBar">
      <button class="btn icon" id="themeToggle" type="button" title="Mudar tema" aria-label="Mudar tema">
        <svg class="ico-sun" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-moon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="btn icon" id="btnClear" type="button" title="Limpar dados salvos" aria-label="Limpar dados salvos">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/></svg>
      </button>
      <button class="btn icon" id="vidToggle" type="button" title="Vídeos de fundo" aria-label="Ligar ou desligar os vídeos de fundo">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <circle cx="9" cy="10" r="1.6"/>
          <path d="M21 16l-5-5-8 8"/>
          <path id="vidSlash" d="M3 3l18 18"/>
        </svg>
      </button>
    </div>

    <div id="titleRow">
      <div id="titleImg" class="empty">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--ink-soft)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
      </div>
      <h1>Para onde vamos?</h1>
    </div>

    <div class="bar">
      <input id="url" type="text" value="https://" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Endereço do site">
      <button class="btn go" id="btnGo" type="button" title="Ir" aria-label="Ir"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg><span>Ir</span></button>
      <button class="btn fav" id="btnFav" type="button" title="Adicionar aos favoritos" aria-label="Adicionar aos favoritos"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg><span></span></button>
      <button class="btn txt" id="btnHist" type="button" aria-label="Histórico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span></span></button>
    </div>

    <div class="section hidden" id="histSection">
      <h2>Histórico</h2>
      <ul class="list" id="histList"></ul>
    </div>

    <div class="section" id="favSection">
      <h2>Favoritos</h2>
      <ul class="list" id="favList"></ul>
    </div>
  </div>
</div>

<div class="modal" id="confirm">
  <div class="modal-box">
    <h2>Limpar dados salvos?</h2>
    <p>Isso apaga seus favoritos, o histórico e as preferências desta página (tema e vídeos). Os favoritos iniciais voltam ao padrão. Não dá para desfazer.</p>
    <div class="modal-btns">
      <button class="btn txt" id="confCancel" type="button">Cancelar</button>
      <button class="btn txt danger" id="confOk" type="button">Limpar tudo</button>
    </div>
  </div>
</div>

<div id="toast"></div>

  /* ---------- Armazenamento persistente (localStorage com reserva em memória) ---------- */
  var memory = {};
  function save(key, value) {
    var s = JSON.stringify(value);
    try { window.localStorage.setItem(key, s); } catch (e) { memory[key] = s; }
  }
  function load(key, fallback) {
    var s = null;
    try { s = window.localStorage.getItem(key); } catch (e) { s = memory[key] || null; }
    if (!s) return fallback;
    try { return JSON.parse(s); } catch (e2) { return fallback; }
  }

  var hist = load(KEY_HIST, []);

    var add = [];
    for (var d = 0; d < DEFAULT_FAVS.length; d++) {
      if (favs.indexOf(DEFAULT_FAVS[d]) === -1) add.push(DEFAULT_FAVS[d]);
    }
    favs = add.concat(favs);
    save(KEY_FAV, favs);
    save(KEY_SEED, true);
  }

    toastTimer = setTimeout(function () { t.className = ""; }, 2200);
  }

  function normalize(raw) {
    var u = (raw || "").replace(/^\s+|\s+$/g, "");
    if (!u || u === "https://" || u === "http://") return "";
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    return u;
  }

  function listOf(kind) { return kind === "fav" ? favs : hist; }
  function persist(kind) { save(kind === "fav" ? KEY_FAV : KEY_HIST, listOf(kind)); }

  function addHistory(url) {
    var out = [url], i;
    for (i = 0; i < hist.length; i++) {
      if (hist[i] !== url) out.push(hist[i]);
    }
    hist = out.slice(0, HIST_MAX);
    save(KEY_HIST, hist);

    addHistory(url);

  var justDragged = false;

  function pointY(e) {
    if (e.touches && e.touches.length) return e.touches[0].clientY;
    if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientY;
    return e.clientY;
  }

  function setT(el, v) {
    el.style.webkitTransform = v;
    el.style.transform = v;
  }

  function isControl(el, li) {
    while (el && el !== li) {
      if (el.tagName === "BUTTON" || el.tagName === "INPUT") return true;
      el = el.parentNode;
    }
    return false;
  }

  function attachDrag(li) {
    function down(e) {
      if (editing.fav !== -1) return;
      if (e.type === "mousedown" && e.button !== 0) return;
      if (isControl(e.target, li)) return;
      var kids = favList.children, centers = [], idx = -1, k, r;
      for (k = 0; k < kids.length; k++) {
        r = kids[k].getBoundingClientRect();
        centers.push(r.top + r.height / 2);
        if (kids[k] === li) idx = k;
      }
      if (idx < 0) return;
      drag = { li: li, i: idx, startY: pointY(e), centers: centers,
               step: li.offsetHeight + 10, target: idx, active: false };
      if (e.type === "mousedown") e.preventDefault();  // evita seleção de texto / arrastar link nativo
    }
    li.addEventListener("mousedown", down);
    li.addEventListener("touchstart", down);
  }

  function dragMove(e) {
    if (!drag) return;
    var dy = pointY(e) - drag.startY;
    if (!drag.active) {
      if (Math.abs(dy) < 8) return;      // abaixo disso ainda é um clique
      drag.active = true;
      drag.li.className += " dragging";
    }
    if (e.cancelable) e.preventDefault();

    var center = drag.centers[drag.i] + dy, target = 0, k;
    for (k = 0; k < drag.centers.length; k++) {
      if (k !== drag.i && drag.centers[k] < center) target++;
    }
    drag.target = target;

    var kids = favList.children, shift;
    for (k = 0; k < kids.length; k++) {
      if (k === drag.i) { setT(kids[k], "translateY(" + dy + "px)"); continue; }
      shift = 0;
      if (drag.i < target && k > drag.i && k <= target) shift = -drag.step;
      else if (drag.i > target && k >= target && k < drag.i) shift = drag.step;
      setT(kids[k], shift ? "translateY(" + shift + "px)" : "");
    }
  }

  function dragEnd() {
    if (!drag) return;
    var d = drag;
    drag = null;
    if (!d.active) return;
    justDragged = true;
    setTimeout(function () { justDragged = false; }, 120);
    if (d.target !== d.i) {
      var moved = favs.splice(d.i, 1)[0];
      favs.splice(d.target, 0, moved);
      persist("fav");
    }
    render("fav");
  }

  document.addEventListener("mousemove", dragMove);
  document.addEventListener("touchmove", dragMove, false);
  document.addEventListener("mouseup", dragEnd);
  document.addEventListener("touchend", dragEnd);
  document.addEventListener("touchcancel", dragEnd);

  function makeItem(kind, i) {
    var url = listOf(kind)[i];
    var li = document.createElement("li");
    li.className = "item";
    if (kind === "fav") { li.className += " fav"; attachDrag(li); }

    if (editing[kind] === i) {
      var inp = document.createElement("input");
      inp.type = "text";
      inp.className = "edit-input";
      inp.value = url;
      inp.setAttribute("autocapitalize", "off");
      inp.setAttribute("autocomplete", "off");
      inp.setAttribute("spellcheck", "false");

      var commit = function () {
        var nu = normalize(inp.value);
        if (!nu) { toast("Endereço inválido"); return; }
        var cur = listOf(kind);
        for (var k = 0; k < cur.length; k++) {
          if (k !== i && cur[k] === nu) { toast("Esse endereço já está na lista"); return; }
        }
        cur[i] = nu;
        persist(kind);
        editing[kind] = -1;
        render(kind);
        toast("Endereço alterado");
      };
      var cancel = function () { editing[kind] = -1; render(kind); };

      inp.onkeydown = function (e) {
        var key = e.keyCode || e.which;
        if (key === 13) { e.preventDefault(); commit(); }
        if (key === 27) { e.preventDefault(); cancel(); }
      };

      li.appendChild(inp);
      li.appendChild(mkBtn("btn act ok", "Salvar", "Salvar alteração", commit, ICON_CHECK));
      li.appendChild(mkBtn("btn act", "Cancelar", "Cancelar edição", cancel, ICON_X));
      setTimeout(function () { try { inp.focus(); } catch (e) {} }, 30);
      return li;
    }

    var a = document.createElement("a");
    a.className = "link";
    a.href = url;
    a.textContent = url;
    a.setAttribute("draggable", "false");
    a.onclick = function (e) {
      e.preventDefault();
      if (justDragged) return;   // soltou um item arrastado: não abrir o link
      visit(url);
    };
    li.appendChild(a);

    if (kind === "hist") {
      var isFav = favs.indexOf(url) !== -1;
      var star = document.createElement("button");
      star.type = "button";
      star.className = "btn act star" + (isFav ? " on" : "");
      star.title = isFav ? "Já está nos favoritos" : "Adicionar aos favoritos";
      star.setAttribute("aria-label", star.title);
      star.innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24" fill="' + (isFav ? "currentColor" : "none") +
        '" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>';
      star.onclick = function () {
        if (favs.indexOf(url) !== -1) { toast("Já está nos favoritos"); return; }
        favs.push(url);
        persist("fav");
        render("fav");
        toast("Adicionado aos favoritos");
      };
      li.appendChild(star);
    }

    li.appendChild(mkBtn("btn act edit", "Editar", "Editar endereço", function () {
      editing[kind] = i;
      render(kind);
    }, ICON_PENCIL));
    li.appendChild(mkBtn("btn act del", "Excluir", "Excluir", function () {
      listOf(kind).splice(i, 1);
      editing[kind] = -1;
      persist(kind);
      render(kind);
      toast(kind === "fav" ? "Favorito removido" : "Removido do histórico");
    }, ICON_TRASH));
    return li;
  }

  function histOpen() { return histSection.className.indexOf("hidden") === -1; }

  function render(kind) {
    renderList(kind);
    if (kind === "fav" && histOpen()) renderList("hist");
  }

  function renderList(kind) {
    var ul = kind === "fav" ? favList : histList;
    var arr = listOf(kind);
    ul.innerHTML = "";
    if (!arr.length) {
      var p = document.createElement("li");
      p.className = "empty";
      p.textContent = kind === "fav"
        ? "Nenhum favorito ainda. Digite um endereço e toque em ⭐."
        : "Nenhum site acessado ainda.";
      ul.appendChild(p);
      return;
    }
    for (var i = 0; i < arr.length; i++) ul.appendChild(makeItem(kind, i));
  }

  /* ---------- Ações ---------- */
  function go() {
    var url = normalize(input.value);
    if (!url) { toast("Digite um endereço"); input.focus(); return; }
    visit(url);
  }

  function addFav() {
    var url = normalize(input.value);
    if (!url) { toast("Digite um endereço para favoritar"); input.focus(); return; }
    if (favs.indexOf(url) !== -1) { toast("Já está nos favoritos"); return; }
    favs.push(url);
    persist("fav");
    render("fav");
    toast("Adicionado aos favoritos ⭐");
  }

  function toggleHist() {
    var open = histSection.className.indexOf("hidden") === -1;
    editing.hist = -1;
    if (open) {
      histSection.className = "section hidden";
      btnHist.className = "btn txt";
    } else {
      render("hist");
      histSection.className = "section";
      btnHist.className = "btn txt on";
    }
  }

  $("btnGo").onclick = go;
  $("btnFav").onclick = addFav;
  btnHist.onclick = toggleHist;
  input.onkeydown = function (e) {
    var k = e.keyCode || e.which;
    if (k === 13) { e.preventDefault(); go(); }
  };

  (function () {
    var box = $("titleImg");
    if (!TITLE_IMAGE) return;
    var src = TITLE_IMAGE.indexOf("data:") === 0 ? TITLE_IMAGE : "data:image/png;base64," + TITLE_IMAGE;
    var img = document.createElement("img");
    img.src = src;
    img.alt = "";
    box.innerHTML = "";
    box.className = "";
    box.appendChild(img);
  })();

  render("fav");

  /* ---------- Tema claro / escuro ---------- */
  var theme = load(KEY_THEME, "dark") === "light" ? "light" : "dark";
  var themeBtn = $("themeToggle");

  function applyTheme() {
    document.documentElement.setAttribute("data-theme", theme);
    var tip = theme === "dark" ? "Mudar para o tema claro" : "Mudar para o tema escuro";
    themeBtn.title = tip;
    themeBtn.setAttribute("aria-label", tip);
  }
  themeBtn.onclick = function () {
    theme = theme === "dark" ? "light" : "dark";
    save(KEY_THEME, theme);
    applyTheme();
  };
  applyTheme();

  /* ---------- Limpar dados salvos ---------- */
  var conf = $("confirm");
  function openConfirm() {
    conf.className = "modal show";
    setTimeout(function () { try { $("confCancel").focus(); } catch (e) {} }, 30);
  }
  function closeConfirm() { conf.className = "modal"; }

  function clearAll() {
    var keys = [KEY_FAV, KEY_HIST, KEY_SEED, KEY_THEME, KEY_VID];
    for (var k = 0; k < keys.length; k++) {
      try { window.localStorage.removeItem(keys[k]); } catch (e) {}
    }
    memory = {};
    window.location.reload();
  }

  $("btnClear").onclick = openConfirm;
  $("confCancel").onclick = closeConfirm;
  $("confOk").onclick = clearAll;
  document.addEventListener("keydown", function (e) {
    if ((e.keyCode || e.which) === 27) closeConfirm();
  });

  /* ---------- Vídeos de fundo em sequência ---------- */
  var KEY_VID = "ps5home_videos";
  var videos = ["background.mp4", "background2.mp4", "background3.mp4"];
  var vid = $("bg"), vidBtn = $("vidToggle"), vidSlash = $("vidSlash");
  var idx = 0, failures = 0;
  var vidOn = load(KEY_VID, false) === true;   // desativados por padrão

  function play(i) {
    idx = i % videos.length;
    vid.src = videos[idx];
    vid.load();
    var p = vid.play();
    if (p && p.catch) p.catch(function () {});
  }

  vid.addEventListener("ended", function () {
    if (!vidOn) return;
    failures = 0;
    play(idx + 1);
  });
  vid.addEventListener("error", function () {
    if (!vidOn) return;
    failures++;
    if (failures < videos.length) play(idx + 1);  // pula vídeo com problema
  });

  function applyVid() {
    var tip = vidOn ? "Vídeos de fundo: ligados" : "Vídeos de fundo: desligados";
    vidBtn.title = tip;
    vidBtn.setAttribute("aria-label", tip);
    vidSlash.style.display = vidOn ? "none" : "";
    vidBtn.setAttribute("aria-pressed", vidOn ? "true" : "false");
    if (vidOn) {
      vid.style.display = "";
      failures = 0;
      play(0);
    } else {
      vid.pause();
      vid.removeAttribute("src");
      try { vid.load(); } catch (e) {}
      vid.style.display = "none";
    }
  }

  vidBtn.onclick = function () {
    vidOn = !vidOn;
    save(KEY_VID, vidOn);
    applyVid();
  };

  applyVid();
})();
</script>
</body>
</html>
