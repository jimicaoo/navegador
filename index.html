<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Início</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #ffffff;
    --ink-soft: rgba(255,255,255,0.72);
    --panel: rgba(10,14,30,0.72);
    --panel-line: rgba(255,255,255,0.14);
    --accent: #2f7bff;
    --accent-hi: #7fb0ff;
    --danger: #ff5d6c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #05070f;
    color: var(--ink);
    font-family: "Sora", "Segoe UI", Helvetica, Arial, sans-serif;
  }

  /* ---------- Vídeo de fundo (sem esticar: mantém proporção e cobre a tela) ---------- */
  #bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    background: #05070f;
  }
  #shade {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1;
    background: rgba(5,7,15,0.38);
  }

  /* ---------- Conteúdo ---------- */
  #page {
    position: relative;
    z-index: 2;
    min-height: 100%;
    padding: 56px 24px 64px;
    display: flex;
    justify-content: center;
  }
  #card {
    width: 100%;
    max-width: 1000px;
  }
  h1 {
    margin: 0 0 28px;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 18px rgba(0,0,0,0.6);
  }

  .bar {
    display: flex;
    align-items: stretch;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 22px;
    padding: 10px;
  }
  .bar input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 24px;
    color: var(--ink);
    background: transparent;
    border: 0;
    outline: none;
    padding: 12px 16px;
  }
  .bar input::placeholder { color: var(--ink-soft); }

  .btn {
    font: inherit;
    font-size: 24px;
    line-height: 1;
    color: var(--ink);
    background: rgba(255,255,255,0.10);
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 0 20px;
    margin-left: 8px;
    min-height: 60px;
    cursor: pointer;
  }
  .btn.go { background: var(--accent); font-size: 28px; padding: 0 28px; }
  .btn.txt { font-size: 20px; font-weight: 600; }
  .btn.on { background: rgba(47,123,255,0.35); border-color: var(--accent-hi); }
  .btn:focus, .btn:hover,
  .bar input:focus,
  a.link:focus, a.link:hover {
    outline: none;
    border-color: #fff;
    box-shadow: 0 0 0 4px rgba(127,176,255,0.55);
  }
  .bar:focus-within { border-color: var(--accent-hi); }

  /* ---------- Seções ---------- */
  .section { margin-top: 28px; }
  .section h2 {
    margin: 0 0 12px 4px;
    font-size: 24px;
    font-weight: 600;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  .list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .item {
    display: flex;
    align-items: stretch;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 16px;
    padding: 8px;
    margin-bottom: 10px;
  }
  a.link {
    flex: 1;
    min-width: 0;
    display: block;
    color: var(--ink);
    text-decoration: none;
    font-size: 20px;
    padding: 14px 16px;
    border: 2px solid transparent;
    border-radius: 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .btn.del {
    font-size: 22px;
    color: var(--danger);
    min-height: 52px;
    padding: 0 18px;
  }
  .empty {
    color: var(--ink-soft);
    font-size: 18px;
    padding: 6px 4px;
  }
  .hidden { display: none; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    z-index: 5;
    background: rgba(10,14,30,0.92);
    border: 1px solid var(--panel-line);
    border-radius: 12px;
    padding: 12px 22px;
    font-size: 18px;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<video id="bg" muted playsinline autoplay preload="auto"></video>
<div id="shade"></div>

<div id="page">
  <div id="card">
    <h1>Para onde vamos?</h1>

    <div class="bar">
      <input id="url" type="text" value="https://" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Endereço do site">
      <button class="btn go" id="btnGo" title="Ir" aria-label="Ir">🚀</button>
      <button class="btn" id="btnFav" title="Adicionar aos favoritos" aria-label="Adicionar aos favoritos">⭐</button>
      <button class="btn txt" id="btnHist" aria-label="Histórico">🕘 Histórico</button>
    </div>

    <div class="section hidden" id="histSection">
      <h2>Histórico</h2>
      <ul class="list" id="histList"></ul>
    </div>

    <div class="section" id="favSection">
      <h2>Favoritos</h2>
      <ul class="list" id="favList"></ul>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  var KEY_FAV = "ps5home_favoritos";
  var KEY_HIST = "ps5home_historico";
  var KEY_SEED = "ps5home_seed_v1";
  var DEFAULT_FAV = "http://nexgen999.github.github.io/ps5webkit";
  var HIST_MAX = 50;

  /* ---------- Armazenamento persistente (localStorage com reserva em memória) ---------- */
  var memory = {};
  function save(key, value) {
    var s = JSON.stringify(value);
    try { window.localStorage.setItem(key, s); } catch (e) { memory[key] = s; }
  }
  function load(key, fallback) {
    var s = null;
    try { s = window.localStorage.getItem(key); } catch (e) { s = memory[key] || null; }
    if (!s) return fallback;
    try { return JSON.parse(s); } catch (e2) { return fallback; }
  }

  var favs = load(KEY_FAV, []);
  var hist = load(KEY_HIST, []);

  // Favorito pré-adicionado: só entra uma vez, para poder ser excluído depois
  if (!load(KEY_SEED, false)) {
    if (favs.indexOf(DEFAULT_FAV) === -1) favs.unshift(DEFAULT_FAV);
    save(KEY_FAV, favs);
    save(KEY_SEED, true);
  }

  /* ---------- Elementos ---------- */
  function $(id) { return document.getElementById(id); }
  var input = $("url"), favList = $("favList"), histList = $("histList");
  var histSection = $("histSection"), btnHist = $("btnHist");

  /* ---------- Utilidades ---------- */
  var toastTimer = null;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.className = "show";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ""; }, 2200);
  }

  function normalize(raw) {
    var u = (raw || "").replace(/^\s+|\s+$/g, "");
    if (!u || u === "https://" || u === "http://") return "";
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    return u;
  }

  function addHistory(url) {
    var out = [url], i;
    for (i = 0; i < hist.length; i++) {
      if (hist[i] !== url) out.push(hist[i]);
    }
    hist = out.slice(0, HIST_MAX);
    save(KEY_HIST, hist);
  }

  function visit(url) {
    addHistory(url);
    window.location.href = url;
  }

  /* ---------- Renderização ---------- */
  function makeItem(url, onDelete, label) {
    var li = document.createElement("li");
    li.className = "item";

    var a = document.createElement("a");
    a.className = "link";
    a.href = url;
    a.textContent = url;
    a.onclick = function (e) {
      e.preventDefault();
      visit(url);
    };

    var del = document.createElement("button");
    del.className = "btn del";
    del.type = "button";
    del.textContent = "✕";
    del.title = label;
    del.setAttribute("aria-label", label);
    del.onclick = onDelete;

    li.appendChild(a);
    li.appendChild(del);
    return li;
  }

  function renderFavs() {
    favList.innerHTML = "";
    if (!favs.length) {
      var p = document.createElement("li");
      p.className = "empty";
      p.textContent = "Nenhum favorito ainda. Digite um endereço e toque em ⭐.";
      favList.appendChild(p);
      return;
    }
    for (var i = 0; i < favs.length; i++) {
      (function (url) {
        favList.appendChild(makeItem(url, function () {
          var out = [];
          for (var k = 0; k < favs.length; k++) if (favs[k] !== url) out.push(favs[k]);
          favs = out;
          save(KEY_FAV, favs);
          renderFavs();
          toast("Favorito removido");
        }, "Excluir favorito"));
      })(favs[i]);
    }
  }

  function renderHist() {
    histList.innerHTML = "";
    if (!hist.length) {
      var p = document.createElement("li");
      p.className = "empty";
      p.textContent = "Nenhum site acessado ainda.";
      histList.appendChild(p);
      return;
    }
    for (var i = 0; i < hist.length; i++) {
      (function (url) {
        histList.appendChild(makeItem(url, function () {
          var out = [];
          for (var k = 0; k < hist.length; k++) if (hist[k] !== url) out.push(hist[k]);
          hist = out;
          save(KEY_HIST, hist);
          renderHist();
        }, "Excluir do histórico"));
      })(hist[i]);
    }
  }

  /* ---------- Ações ---------- */
  function go() {
    var url = normalize(input.value);
    if (!url) { toast("Digite um endereço"); input.focus(); return; }
    visit(url);
  }

  function addFav() {
    var url = normalize(input.value);
    if (!url) { toast("Digite um endereço para favoritar"); input.focus(); return; }
    if (favs.indexOf(url) !== -1) { toast("Já está nos favoritos"); return; }
    favs.push(url);
    save(KEY_FAV, favs);
    renderFavs();
    toast("Adicionado aos favoritos ⭐");
  }

  function toggleHist() {
    var open = histSection.className.indexOf("hidden") === -1;
    if (open) {
      histSection.className = "section hidden";
      btnHist.className = "btn txt";
    } else {
      renderHist();
      histSection.className = "section";
      btnHist.className = "btn txt on";
    }
  }

  $("btnGo").onclick = go;
  $("btnFav").onclick = addFav;
  btnHist.onclick = toggleHist;
  input.onkeydown = function (e) {
    var k = e.keyCode || e.which;
    if (k === 13) { e.preventDefault(); go(); }
  };

  renderFavs();

  /* ---------- Vídeos de fundo em sequência ---------- */
  var videos = ["background.mp4", "background2.mp4", "background3.mp4"];
  var vid = $("bg");
  var idx = 0, failures = 0;

  function play(i) {
    idx = i % videos.length;
    vid.src = videos[idx];
    vid.load();
    var p = vid.play();
    if (p && p.catch) p.catch(function () {});
  }

  vid.addEventListener("ended", function () { failures = 0; play(idx + 1); });
  vid.addEventListener("error", function () {
    failures++;
    if (failures < videos.length) play(idx + 1);  // pula vídeo com problema
  });

  play(0);
})();
</script>
</body>
</html>
